services:

  db:
    image: postgres:16-alpine
    container_name: portal_agronomia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_agronomia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # porta 5433 no host para não conflitar com outros projetos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: app   # o Dockerfile tem dois estágios; o último é o do Nginx
    container_name: portal_agronomia_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app              # monta o código local dentro do container
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-secret-key-troque-em-producao
      DEBUG: "True"
      DB_NAME: portal_agronomia
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db             # nome do serviço acima, não localhost
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
