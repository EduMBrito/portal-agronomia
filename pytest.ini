[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests/test_*.py

# Diretórios gerados que o pytest não deve percorrer. Sem isto, quem rodar
# `collectstatic` na máquina local quebra a coleta de testes: o pytest entra
# em staticfiles/ e tropeça nos vendorizados do admin do Django.
norecursedirs = staticfiles media .bin assets .git __pycache__
