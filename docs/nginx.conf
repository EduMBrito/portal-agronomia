# Portal Agronomia IFSertãoPE — configuração do Nginx
#
# Este é o arquivo canônico. O docs/DEPLOY.md aponta para cá em vez de repetir
# a configuração: enquanto existiam duas cópias, elas divergiram e uma delas
# ficou sem ssl_protocols.
#
# Instalar como /etc/nginx/sites-available/portal-agronomia e criar o link em
# sites-enabled. Trocar o server_name e os caminhos pelo que valer no servidor.
#
#     sudo nginx -t && sudo systemctl reload nginx

# Zona de limite de requisições para a tela de login do admin. Precisa ficar no
# contexto http{}, que é onde este arquivo é incluído.
#
# 10 MB guardam cerca de 160 mil endereços. 5 tentativas por minuto por IP é
# folgado para uma comissão de 3 a 5 pessoas e inviabiliza força bruta: nem o
# Django nem o Wagtail têm bloqueio por tentativas, e o portal fica exposto na
# internet.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name portal.agronomia.ifsertao.edu.br;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` e não a diretiva `http2 on;`: o Ubuntu 22.04 LTS traz
    # o Nginx 1.18, e `http2 on;` só existe a partir do 1.25.1.
    listen 443 ssl http2;
    server_name portal.agronomia.ifsertao.edu.br;

    ssl_certificate     /etc/letsencrypt/live/portal.agronomia.ifsertao.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.agronomia.ifsertao.edu.br/privkey.pem;

    # Sem esta linha o Nginx herda o default do sistema, que em instalação mais
    # antiga ainda aceita TLS 1.0 e 1.1.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Não anunciar a versão do Nginx nas respostas e nas páginas de erro.
    server_tokens off;

    client_max_body_size 20M;

    # ------------------------------------------------------------------
    # Estáticos
    # ------------------------------------------------------------------

    # O ManifestStaticFilesStorage põe hash no nome do arquivo, então o cache
    # longo é seguro: nome novo a cada build.
    location /static/ {
        alias /opt/portal-agronomia/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Media — só as imagens são públicas
    # ------------------------------------------------------------------
    #
    # As imagens do Wagtail (originais e renditions) são públicas por natureza:
    # aparecem nas páginas do portal e o Nginx as entrega direto, sem custar
    # worker do Gunicorn.
    #
    # Todo o resto de /media/ é negado. Documentos ficam em media/documents/ e
    # DEVEM ser acessados por /documents/<id>/<nome>, que é a rota do Wagtail
    # onde a permissão de coleção é checada (WAGTAILDOCS_SERVE_METHOD =
    # "serve_view"). Servir media/ inteiro como alias, que era o que esta
    # configuração fazia antes, contornava essa checagem: bastava adivinhar o
    # nome do arquivo para baixar documento de coleção privada ou regulamento
    # já marcado como inativo. E um XML de Lattes esquecido no diretório virava
    # download público, com CPF e telefone dentro.
    #
    # Prefixo mais longo vence no Nginx, então as duas regras abaixo têm
    # precedência sobre o `location /media/`.

    location /media/images/ {
        alias /opt/portal-agronomia/media/images/;
        expires 7d;
    }

    location /media/original_images/ {
        alias /opt/portal-agronomia/media/original_images/;
        expires 7d;
    }

    location /media/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # Aplicação
    # ------------------------------------------------------------------

    # Tela de login do admin, com limite de tentativas. `burst=3 nodelay`
    # absorve o recarregar honesto sem atrasar o usuário legítimo; o excedente
    # leva 503.
    #
    # É `location =` (correspondência exata) e não prefixo: limitar /admin/
    # inteiro atrapalharia a comissão editando conteúdo, que faz dezenas de
    # requisições por minuto.
    location = /admin/login/ {
        limit_req zone=admin_login burst=3 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Documento grande servido pelo Gunicorn pode demorar em disco lento.
        proxy_read_timeout 120s;
    }
}
