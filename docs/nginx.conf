# Portal Agronomia IFSertãoPE — configuração do Nginx
#
# Este arquivo deixou de ser só documentação: o estágio `nginx` do Dockerfile o
# copia para /etc/nginx/conf.d/default.conf. Editar aqui e reconstruir a
# imagem — não existe cópia no servidor para ajustar à mão.
#
#     docker compose -f docker-compose.prod.yml build nginx
#     docker compose -f docker-compose.prod.yml run --rm nginx nginx -t
#
# TLS saiu deste arquivo. Quem termina o HTTPS é o Caddy do pve-proxy
# (172.16.172.10); daqui para dentro só trafega HTTP na rede do campus.
#
# O arquivo é incluído dentro do http{} pela imagem oficial, que é onde
# limit_req_zone, map e set_real_ip_from precisam estar.

# ---------------------------------------------------------------------------
# IP real do cliente
# ---------------------------------------------------------------------------
#
# Sem isto o $remote_addr seria sempre o do pve-proxy, e o limite de tentativas
# de login abaixo passaria a valer para a internet inteira somada, num balde
# só: um atacante trancaria a comissão para fora em vez de si mesmo.
#
# ATENÇÃO — conferir no primeiro acesso. Com a porta publicada pelo Docker, a
# origem que chega aqui pode ser o gateway da rede bridge em vez do IP do
# pve-proxy, dependendo do userland-proxy:
#
#     docker compose -f docker-compose.prod.yml logs nginx | tail
#
# Se o log mostrar um 172.x que não seja 172.16.172.10, acrescentar essa origem
# numa segunda linha set_real_ip_from. Não deixamos uma faixa ampla aqui de
# antemão: confiar em /12 é confiar em toda a rede do campus para forjar o
# cabeçalho. Ver docs/INFRAESTRUTURA.md, seção 3.3.
set_real_ip_from 172.16.172.10;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# Esquema original da requisição
# ---------------------------------------------------------------------------
#
# Antes este arquivo repassava $scheme, o que estava certo enquanto o próprio
# Nginx terminava o TLS. Agora ele recebe HTTP do Caddy, e repassar $scheme
# diria "http" ao Django — que responderia 301 para https://, o Caddy
# encaminharia de novo em HTTP, e o portal entraria em laço infinito.
#
# Então repassamos o que o Caddy mandou, e só caímos no $scheme quando o
# cabeçalho não existe (acesso interno direto, sem proxy na frente).
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Zona de limite de requisições para a tela de login do admin.
#
# 10 MB guardam cerca de 160 mil endereços. 5 tentativas por minuto por IP é
# folgado para uma comissão de 3 a 5 pessoas e inviabiliza força bruta: nem o
# Django nem o Wagtail têm bloqueio por tentativas, e o portal fica exposto na
# internet.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;

    # O subdomínio ainda não foi definido pela TI, e quem valida o Host é o
    # ALLOWED_HOSTS do Django — não precisa estar duplicado aqui.
    server_name _;

    # Não anunciar a versão do Nginx nas respostas e nas páginas de erro.
    server_tokens off;

    client_max_body_size 20M;

    # ------------------------------------------------------------------
    # Estáticos
    # ------------------------------------------------------------------

    # Vêm assados na imagem, copiados do estágio `app`. O
    # ManifestStaticFilesStorage põe hash no nome do arquivo, então o cache
    # longo é seguro: nome novo a cada build.
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Media — só as imagens são públicas
    # ------------------------------------------------------------------
    #
    # As imagens do Wagtail (originais e renditions) são públicas por natureza:
    # aparecem nas páginas do portal e o Nginx as entrega direto, sem custar
    # worker do Gunicorn.
    #
    # Todo o resto de /media/ é negado. Documentos ficam em media/documents/ e
    # DEVEM ser acessados por /documents/<id>/<nome>, que é a rota do Wagtail
    # onde a permissão de coleção é checada (WAGTAILDOCS_SERVE_METHOD =
    # "serve_view"). Servir media/ inteiro como alias, que era o que esta
    # configuração fazia antes, contornava essa checagem: bastava adivinhar o
    # nome do arquivo para baixar documento de coleção privada ou regulamento
    # já marcado como inativo. E um XML de Lattes esquecido no diretório virava
    # download público, com CPF e telefone dentro.
    #
    # Prefixo mais longo vence no Nginx, então as duas regras abaixo têm
    # precedência sobre o `location /media/`.

    location /media/images/ {
        alias /app/media/images/;
        expires 7d;
    }

    location /media/original_images/ {
        alias /app/media/original_images/;
        expires 7d;
    }

    location /media/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # Entrega de documento depois da checagem de permissão
    # ------------------------------------------------------------------
    #
    # `internal` — inalcançável de fora; só o próprio Nginx entra aqui, quando
    # o Django responde com o cabeçalho X-Accel-Redirect.
    #
    # O fluxo: o Wagtail checa a permissão de coleção em /documents/<id>/<nome>
    # e, em vez de despejar o arquivo pelo Python, devolve uma resposta vazia
    # apontando para cá. A permissão continua sendo checada; o worker do
    # Gunicorn é liberado sem copiar o arquivo byte a byte.
    #
    # Combina com SENDFILE_ROOT=/app/media e SENDFILE_URL=/_protegido no
    # settings de produção. Mudar um exige mudar o outro.
    location /_protegido/ {
        internal;
        alias /app/media/;
    }

    # ------------------------------------------------------------------
    # Aplicação
    # ------------------------------------------------------------------

    # `web` é o nome do serviço no docker-compose.prod.yml, resolvido pelo DNS
    # da rede do Compose.

    # Tela de login do admin, com limite de tentativas. `burst=3 nodelay`
    # absorve o recarregar honesto sem atrasar o usuário legítimo; o excedente
    # leva 503.
    #
    # É `location =` (correspondência exata) e não prefixo: limitar /admin/
    # inteiro atrapalharia a comissão editando conteúdo, que faz dezenas de
    # requisições por minuto.
    location = /admin/login/ {
        limit_req zone=admin_login burst=3 nodelay;

        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $proto_original;
    }

    # O proxy_buffering fica no default (ligado): o Nginx drena a resposta do
    # Gunicorn e alimenta o cliente lento sozinho, em vez de segurar o worker
    # pelo tempo da transferência.
    #
    # O que excede os buffers iria para arquivo temporário em disco — escrita
    # no RAID-6, que é lento. Não é preocupação aqui porque nada grande passa
    # por este caminho: estáticos, imagens e documentos são servidos pelo
    # próprio Nginx, nos locations acima. O que sobra para o Gunicorn é HTML,
    # de alguns KB, que cabe nos buffers de memória.
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $proto_original;

        proxy_read_timeout 120s;
    }
}
