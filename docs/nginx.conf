server {
    listen 80;
    server_name portal-agronomia.ifsertao.edu.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal-agronomia.ifsertao.edu.br;

    ssl_certificate     /etc/ssl/certs/ifsertao.crt;
    ssl_certificate_key /etc/ssl/private/ifsertao.key;

    location /static/ {
        alias /var/www/portal-agronomia/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/portal-agronomia/media/;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
    }
}
