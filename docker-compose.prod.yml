services:

  db:
    image: postgres:16-alpine
    container_name: portal_agronomia_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: portal_agronomia_web
    restart: always
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      # Bind mounts — Nginx serve esses diretórios diretamente do host.
      # Não montar o código-fonte aqui: produção usa a imagem buildada.
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"   # exposto apenas no loopback — Nginx faz o proxy
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
